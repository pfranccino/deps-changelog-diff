name: Changelog diff

# CI example. Expects a dependency_status.json (generated by toml-deps-checker).
# Adjust the step that produces/retrieves it according to your pipeline.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # You need a dependency_status.json here. For example, upload it as an artifact
      # from the toml-deps-checker job and retrieve it with actions/download-artifact.
      # - uses: actions/download-artifact@v4
      #   with: { name: dependency-status }

      - name: Install dependencies (lightweight, no Playwright in CI)
        run: pip install -r requirements.txt

      - name: Analyze changes between versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # only if using --summarize
        # --no-crawl4ai avoids installing Playwright: in CI most data comes from GitHub API +
        # AndroidX (static HTML) + official pages.
        run: python changelog-diff.py dependency_status.json --md changelog.md --no-crawl4ai

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: changelog-diff
          path: |
            changelog_diff.json
            changelog.md
