name: Changelog diff

# Ejemplo de CI. Espera un dependency_status.json (lo genera toml-deps-checker).
# Ajusta el paso que lo produce/recupera según tu pipeline.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # cada lunes 09:00 UTC

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Aquí debes tener un dependency_status.json. Por ejemplo, súbelo como artifact
      # desde el job de toml-deps-checker y recupéralo con actions/download-artifact.
      # - uses: actions/download-artifact@v4
      #   with: { name: dependency-status }

      - name: Instalar dependencias (ligero, sin Playwright en CI)
        run: pip install requests

      - name: Analizar cambios entre versiones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # solo si usas --summarize
        # --no-crawl4ai evita instalar Playwright: en CI casi todo sale por GitHub API +
        # AndroidX (HTML estático) + páginas oficiales.
        run: python changelog-diff.py dependency_status.json --md changelog.md --no-crawl4ai

      - name: Publicar informe
        uses: actions/upload-artifact@v4
        with:
          name: changelog-diff
          path: |
            changelog_diff.json
            changelog.md
